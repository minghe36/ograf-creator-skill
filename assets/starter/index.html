<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>OGraf lower third</title>
<style>html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}ograf-starter{display:block;width:100%;height:100%}</style>
</head>
<body>
<script src="runtime.js"></script>
<script>
(() => {
  const emit = (type, extra = {}) => parent.postMessage({ type, ...extra }, '*');
  customElements.define('ograf-starter', window.OgrafStarterGraphic);
  const graphic = document.createElement('ograf-starter');
  document.body.append(graphic);
  graphic.addEventListener('ograf-ended', () => emit('ograf:ended'));
  let ready = graphic.load();
  addEventListener('message', async (event) => {
    if (event.source !== parent && event.source !== window) return;
    const message = event.data;
    if (!message || typeof message !== 'object') return;
    try {
      await ready;
      if (message.type === 'ograf:update') {
        if (message.renderCharacteristics) { graphic._resolution = message.renderCharacteristics.resolution; graphic._layout(); }
        await graphic.updateAction({ data: message.data });
      } else if (message.type === 'ograf:start') await graphic.playAction();
      else if (message.type === 'ograf:stop') await graphic.stopAction();
    } catch (error) { emit('ograf:error', { error: String(error) }); }
  });
  addEventListener('error', event => emit('ograf:error', { error: event.message }));
  addEventListener('unhandledrejection', event => emit('ograf:error', { error: String(event.reason) }));
  ready.then(() => emit('ograf:ready')).catch(error => emit('ograf:error', { error: String(error) }));
})();
</script>
</body>
</html>
